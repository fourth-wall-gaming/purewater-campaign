description: "A faithful Classic Fantasy Imperative (CFI) port of 'And then the Dragons Came', relocated from Zorastor to Purewater -- a Venice-like canal city where the sacred waters of the Lake Lady meet the sea. Baron Hanzo di Teufel arrives with his Dragon Knights for the Lake Lady's Tourney, his possessed champion concealed among them, and four strangers tied by fate are drawn into stopping him."
game_system: "classic-fantasy"
setting: "Purewater, the city of canals -- a port in the realm of Mystamyr"
game_date: "Two days before the Lake Lady's Tourney (night of the woods ambush)"
current_scene: "Alliance with Crowbill's underworld sealed at the Gallows Reach counting-house. In exchange for the Baron's plan, a way into the fortified estate (finishing Nus's map), and control of the twins' street-story, Crowbill opens his canals, safe houses, men, and rumor-machine against the Baron. His lead: the Baron's champion has never left the estate -- unseen, kept like a relic. Two days before the Lake Lady's Tourney; the party must uncover what the devilry is for."
