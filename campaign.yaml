description: "A Classic Fantasy Imperative port of 'And then the Dragons Came', relocated to Purewater -- a Venice-like canal city where the sacred waters of the Lake Lady meet the sea. Baron Hanzo di Teufel arrives with his Dragon Knights for the Lake Lady's Tourney, his possessed champion concealed among them. Four strangers arrive the same week. Built as a living world: every NPC and faction runs its own agenda on a clock, and what the party does not witness happens anyway."
game_date: "d-2/night"
current_scene: "Midnight in the Temple of the Lake Lady, Temple Isle. Magda and Gardwen have laid everything before High Priestess Nerissa: the killing, the shade aboard the DragonBarge, and the four remaining twists of hair -- one of them her niece Sana's, cut with shears from behind, a girl Nerissa has not seen in three weeks. Nerissa has traded her own secret: the Lady's water went thin as the Baron entered and Prince Emeric silenced her alarm in writing. One day and a night until the Tourney."
