name: "Purewater \u2014 Gardwen"
description: "A Classic Fantasy Imperative port of 'And then the Dragons Came', relocated to Purewater -- a Venice-like canal city where the sacred waters of the Lake Lady meet the sea. Baron Hanzo di Teufel arrives with his Dragon Knights for the Lake Lady's Tourney, his possessed champion concealed among them. Four strangers arrive the same week. Built as a living world: every NPC and faction runs its own agenda on a clock, and what the party does not witness happens anyway."
game_date: "d1/dusk -- the eve of the sand"
current_scene: "d1/dawn, the second day of the Tourney. Gardwen is on Nettle Lane at first light having just met Crowbill on a cookshop roof. She has his offer: his best hand will take the locket off Hanzo at the rail of the lists tomorrow morning, if Nerissa will agree IN ADVANCE to shelter the thief afterwards -- and Crowbill wants her word today, before the Archery, then Gardwen in person with the thief to hear the terms. Ila comes to Crowbill only if she chooses it, witnessed. Overnight and unknown to the party: Santo opened the parcel and knows the knife is a forgery. The dredgers have stopped the water-stairs on the morning of the Archery. Nerissa is at the deep pool."
